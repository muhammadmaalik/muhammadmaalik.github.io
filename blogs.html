<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blogs — Muhammad Maalik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      if (new URLSearchParams(location.search).has("embed")) {
        document.documentElement.classList.add("embed");
      }
    </script>
    <style>
      body {
        background: #fff;
        color: #111;
      }
      .blog-page {
        width: min(680px, calc(100% - 36px));
        margin: 0 auto;
        padding: 22px 0 48px;
      }
      .blog-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 28px;
      }
      .blog-top a {
        color: #111;
      }
      html.embed .blog-top {
        display: none;
      }
      .blog-page h1 {
        font-size: 48px;
        letter-spacing: -0.04em;
      }
      .post {
        padding: 22px 0;
        border-top: 1px solid #111;
      }
      .post h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      .post time {
        display: block;
        margin-top: 6px;
        font-style: italic;
        font-size: 16px;
      }
      .post p {
        margin: 12px 0 0;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .empty {
        font-style: italic;
      }
      .tools {
        margin-top: 8px;
        display: flex;
        gap: 14px;
      }
      .tools button,
      .editor button,
      .unlock button {
        border: 0;
        background: transparent;
        color: #111;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .editor,
      .unlock {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid #111;
        display: grid;
        gap: 10px;
      }
      .editor input,
      .editor textarea,
      .unlock input {
        width: 100%;
        font: inherit;
        color: #111;
        background: #fff;
        border: 1px solid #111;
        border-radius: 0;
        padding: 10px 12px;
      }
      .editor textarea {
        min-height: 160px;
        resize: vertical;
      }
      .save {
        justify-self: start;
        background: #111 !important;
        color: #fff !important;
        text-decoration: none !important;
        padding: 6px 12px !important;
      }
      .note {
        margin: 0;
        font-style: italic;
        font-size: 16px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="blog-page">
      <div class="blog-top">
        <h1>Blogs</h1>
        <a class="back-home" href="./index.html" target="_top">Portfolio</a>
      </div>
      <div id="posts"></div>
      <p class="empty" id="empty" hidden>No posts yet.</p>

      <form class="unlock" id="unlock">
        <button type="button" id="show-edit">Edit</button>
        <div id="key-row" hidden>
          <input id="key" type="password" autocomplete="current-password" placeholder="Editor key" />
          <button type="submit">Unlock</button>
          <p class="note" id="key-error" hidden>That key does not match.</p>
        </div>
      </form>

      <form class="editor" id="editor" hidden>
        <p class="note">Saving here updates the page for anyone who has it open.</p>
        <input id="title" name="title" placeholder="Title" required />
        <textarea id="body" name="body" placeholder="Write" required></textarea>
        <button class="save" type="submit">Publish</button>
      </form>
    </main>
    <script>
      const postsEl = document.querySelector("#posts");
      const emptyEl = document.querySelector("#empty");
      const unlock = document.querySelector("#unlock");
      const editor = document.querySelector("#editor");
      const keyInput = document.querySelector("#key");
      const keyError = document.querySelector("#key-error");
      const REPO_FILE =
        "https://raw.githubusercontent.com/muhammadmaalik/muhammadmaalik.github.io/main/blogs.json";
      let saveUrl = "./blogs.json";
      let posts = [];
      let snapshot = "";
      let key = sessionStorage.getItem("blog-key") || "";
      let editing = false;

      function localPage() {
        return location.hostname === "127.0.0.1" || location.hostname === "localhost";
      }

      async function resolveSaveUrl() {
        if (localPage()) return "./blogs.json";
        try {
          const response = await fetch("./editor.json", { cache: "no-store" });
          if (!response.ok) return "./blogs.json";
          const data = await response.json();
          if (!data.save) return "./blogs.json";
          return data.save.replace(/\/$/, "") + "/blogs.json";
        } catch {
          return "./blogs.json";
        }
      }

      function escapeText(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function stamp() {
        return new Date().toISOString();
      }

      function showDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function render() {
        postsEl.replaceChildren();
        emptyEl.hidden = posts.length > 0;
        for (const post of posts) {
          const article = document.createElement("article");
          article.className = "post";
          const title = document.createElement("h2");
          title.textContent = post.title;
          const time = document.createElement("time");
          time.dateTime = post.updated || "";
          time.textContent = showDate(post.updated);
          const body = document.createElement("p");
          body.textContent = post.body;
          article.append(title, time, body);
          if (key) {
            const tools = document.createElement("div");
            tools.className = "tools";
            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "Edit";
            edit.addEventListener("click", () => beginEdit(post, article));
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "Delete";
            remove.addEventListener("click", () => removePost(post));
            tools.append(edit, remove);
            article.append(tools);
          }
          postsEl.append(article);
        }
      }

      function beginEdit(post, article) {
        editing = true;
        article.replaceChildren();
        const form = document.createElement("form");
        form.className = "editor";
        const title = document.createElement("input");
        title.value = post.title;
        const body = document.createElement("textarea");
        body.value = post.body;
        const save = document.createElement("button");
        save.className = "save";
        save.type = "submit";
        save.textContent = "Save";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => {
          editing = false;
          render();
        });
        form.append(title, body, save, cancel);
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          post.title = title.value.trim();
          post.body = body.value.trim();
          post.updated = stamp();
          if (!post.title || !post.body) return;
          await savePosts();
          editing = false;
          render();
        });
        article.append(form);
        title.focus();
      }

      async function readJson(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      }

      async function loadPosts() {
        if (editing) return;
        const urls = [];
        if (!localPage() && saveUrl.startsWith("http")) urls.push(saveUrl);
        urls.push(REPO_FILE + "?t=" + Date.now());
        urls.push("./blogs.json?t=" + Date.now());
        let next = null;
        for (const url of urls) {
          try {
            next = await readJson(url);
            break;
          } catch {
            next = null;
          }
        }
        if (!Array.isArray(next)) return;
        const text = JSON.stringify(next);
        if (text === snapshot) return;
        snapshot = text;
        posts = next;
        if (!editing) render();
      }

      function rejectSave(message) {
        key = "";
        sessionStorage.removeItem("blog-key");
        unlock.hidden = false;
        document.querySelector("#key-row").hidden = false;
        editor.hidden = true;
        keyError.textContent = message;
        keyError.hidden = false;
        render();
      }

      async function savePosts() {
        let response;
        try {
          response = await fetch(saveUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Blog-Key": key,
            },
            body: JSON.stringify(posts),
          });
        } catch {
          rejectSave("Publishing needs this computer to be on. The key itself did not change.");
          throw new Error("save failed");
        }
        if (response.status === 403) {
          rejectSave("That key does not match.");
          throw new Error("save failed");
        }
        if (!response.ok) {
          rejectSave("GitHub cannot store the post by itself. Open the site on this computer, or try again in a moment.");
          throw new Error("save failed");
        }
        snapshot = JSON.stringify(posts);
      }

      async function removePost(post) {
        editing = false;
        posts = posts.filter((item) => item !== post);
        await savePosts();
        render();
      }

      document.querySelector("#show-edit").addEventListener("click", () => {
        document.querySelector("#key-row").hidden = false;
        keyInput.focus();
      });

      unlock.addEventListener("submit", async (event) => {
        event.preventDefault();
        key = keyInput.value.trim();
        keyError.hidden = true;
        try {
          await loadPosts();
          await savePosts();
          sessionStorage.setItem("blog-key", key);
          unlock.hidden = true;
          editor.hidden = false;
          render();
        } catch {
          key = "";
          sessionStorage.removeItem("blog-key");
        }
      });

      editor.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = document.querySelector("#title");
        const body = document.querySelector("#body");
        posts.unshift({
          title: title.value.trim(),
          body: body.value.trim(),
          updated: stamp(),
        });
        await savePosts();
        title.value = "";
        body.value = "";
        render();
      });

      if (key) {
        unlock.hidden = true;
        editor.hidden = false;
      }

      resolveSaveUrl().then((url) => {
        saveUrl = url;
        loadPosts();
      });
      setInterval(() => {
        if (!editing && document.activeElement !== document.querySelector("#title") && document.activeElement !== document.querySelector("#body")) {
          loadPosts();
        }
      }, 2000);
    </script>
  </body>
</html>
