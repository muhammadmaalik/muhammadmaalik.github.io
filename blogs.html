<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blogs — Muhammad Maalik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      if (new URLSearchParams(location.search).has("embed")) {
        document.documentElement.classList.add("embed");
      }
    </script>
    <style>
      body {
        background: #fff;
        color: #111;
      }
      .blog-page {
        width: min(680px, calc(100% - 36px));
        margin: 0 auto;
        padding: 22px 0 48px;
      }
      .blog-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 28px;
      }
      .blog-top a {
        color: #111;
      }
      html.embed .blog-top {
        display: none;
      }
      .blog-page h1 {
        font-size: 48px;
        letter-spacing: -0.04em;
      }
      .post {
        padding: 22px 0;
        border-top: 1px solid #111;
      }
      .post h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      .post time {
        display: block;
        margin-top: 6px;
        font-style: italic;
        font-size: 16px;
      }
      .post p {
        margin: 12px 0 0;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .empty {
        font-style: italic;
      }
      .tools {
        margin-top: 8px;
        display: flex;
        gap: 14px;
      }
      .tools button,
      .editor button,
      .unlock button {
        border: 0;
        background: transparent;
        color: #111;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .editor,
      .unlock {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid #111;
        display: grid;
        gap: 10px;
      }
      .editor input,
      .editor textarea,
      .unlock input {
        width: 100%;
        font: inherit;
        color: #111;
        background: #fff;
        border: 1px solid #111;
        border-radius: 0;
        padding: 10px 12px;
      }
      .editor textarea {
        min-height: 160px;
        resize: vertical;
      }
      .save {
        justify-self: start;
        background: #111 !important;
        color: #fff !important;
        text-decoration: none !important;
        padding: 6px 12px !important;
      }
      .note {
        margin: 0;
        font-style: italic;
        font-size: 16px;
      }
      .key-row {
        display: grid;
        gap: 10px;
      }
      .remember {
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .remember input {
        width: auto;
        margin: 0;
        accent-color: #111;
      }
      .editor-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
      }
      .save:disabled {
        opacity: 0.5;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="blog-page">
      <div class="blog-top">
        <h1>Blogs</h1>
        <a class="back-home" href="./index.html" target="_top">Portfolio</a>
      </div>
      <div id="posts"></div>
      <p class="empty" id="empty" hidden>No posts yet.</p>

      <form class="unlock" id="unlock">
        <button type="button" id="show-edit">Edit</button>
        <div id="key-row" class="key-row" hidden>
          <input id="key" type="password" autocomplete="off" placeholder="Editor key" />
          <label class="remember"><input id="remember" type="checkbox" /> Remember on this device</label>
          <button type="submit" id="unlock-button">Unlock</button>
          <p class="note" id="key-help"></p>
          <p class="note" id="key-error" hidden>That key does not match.</p>
        </div>
      </form>

      <form class="editor" id="editor" hidden>
        <div class="editor-top">
          <p class="note" id="editor-note"></p>
          <button type="button" id="lock">Lock</button>
        </div>
        <input id="title" name="title" placeholder="Title" required />
        <textarea id="body" name="body" placeholder="Write. Leave a blank line between paragraphs." required></textarea>
        <button class="save" type="submit" id="publish">Publish</button>
        <p class="note" id="save-status" hidden></p>
      </form>
    </main>
    <script>
      // Readers get blogs.json straight from the site. The editor saves either
      // to the local serve.py (while working on this computer) or, on the live
      // site, commits blogs.json to GitHub with a token scoped to this repo.
      const GITHUB = {
        owner: "muhammadmaalik",
        repo: "muhammadmaalik.github.io",
        branch: "main",
        file: "blogs.json",
      };

      const postsEl = document.querySelector("#posts");
      const emptyEl = document.querySelector("#empty");
      const unlock = document.querySelector("#unlock");
      const keyRow = document.querySelector("#key-row");
      const editor = document.querySelector("#editor");
      const keyInput = document.querySelector("#key");
      const remember = document.querySelector("#remember");
      const keyHelp = document.querySelector("#key-help");
      const keyError = document.querySelector("#key-error");
      const editorNote = document.querySelector("#editor-note");
      const saveStatus = document.querySelector("#save-status");
      const publishButton = document.querySelector("#publish");
      const unlockButton = document.querySelector("#unlock-button");

      const local = location.hostname === "127.0.0.1" || location.hostname === "localhost";
      let posts = [];
      let fileSha = null;
      let key = sessionStorage.getItem("blog-key") || localStorage.getItem("blog-key") || "";
      let editing = false;

      keyHelp.textContent = local
        ? "The key is in blog.key next to serve.py."
        : "A GitHub fine-grained token for this repository with Contents: read and write. It stays in this browser only.";
      editorNote.textContent = local
        ? "Saving writes blogs.json on this computer. Commit it to publish."
        : "Publishing commits blogs.json to GitHub. The live page follows in about a minute.";

      function showDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function stamp() {
        return new Date().toISOString();
      }

      function status(message, isError) {
        saveStatus.textContent = message;
        saveStatus.hidden = !message;
        saveStatus.style.color = isError ? "#8e0000" : "";
      }

      function render() {
        postsEl.replaceChildren();
        emptyEl.hidden = posts.length > 0;
        for (const post of posts) {
          const article = document.createElement("article");
          article.className = "post";
          const title = document.createElement("h2");
          title.textContent = post.title;
          const time = document.createElement("time");
          time.dateTime = post.updated || "";
          time.textContent = showDate(post.updated);
          const body = document.createElement("p");
          body.textContent = post.body;
          article.append(title, time, body);
          if (key) {
            const tools = document.createElement("div");
            tools.className = "tools";
            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "Edit";
            edit.addEventListener("click", () => beginEdit(post, article));
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "Delete";
            remove.addEventListener("click", () => removePost(post));
            tools.append(edit, remove);
            article.append(tools);
          }
          postsEl.append(article);
        }
      }

      function beginEdit(post, article) {
        editing = true;
        article.replaceChildren();
        const form = document.createElement("form");
        form.className = "editor";
        const title = document.createElement("input");
        title.value = post.title;
        const body = document.createElement("textarea");
        body.value = post.body;
        const save = document.createElement("button");
        save.className = "save";
        save.type = "submit";
        save.textContent = "Save";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => {
          editing = false;
          render();
        });
        form.append(title, body, save, cancel);
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const nextTitle = title.value.trim();
          const nextBody = body.value.trim();
          if (!nextTitle || !nextBody) return;
          const previous = { ...post };
          post.title = nextTitle;
          post.body = nextBody;
          post.updated = stamp();
          save.disabled = true;
          try {
            await savePosts(`Edit blog post: ${nextTitle}`);
            editing = false;
            render();
          } catch (error) {
            Object.assign(post, previous);
            save.disabled = false;
          }
        });
        article.append(form);
        title.focus();
      }

      // --- reading -------------------------------------------------------

      async function loadPublished() {
        try {
          const response = await fetch(`./blogs.json?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(String(response.status));
          const data = await response.json();
          if (Array.isArray(data)) {
            posts = data;
            render();
          }
        } catch {
          emptyEl.textContent = "The posts could not be loaded.";
          emptyEl.hidden = false;
        }
      }

      // --- GitHub ---------------------------------------------------------

      function githubHeaders() {
        return {
          Authorization: `Bearer ${key}`,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        };
      }

      function contentsUrl() {
        return `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.file}`;
      }

      function encodeBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      function decodeBase64(text) {
        const binary = atob(text.replace(/\n/g, ""));
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function githubVerify() {
        const response = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}`, {
          headers: githubHeaders(),
        });
        if (response.status === 401) throw new Error("That key does not match.");
        if (!response.ok) throw new Error("GitHub did not answer. Try again in a moment.");
        const data = await response.json();
        if (!data.permissions || !data.permissions.push) {
          throw new Error("That token can read this repository but not write to it. Give it Contents: read and write.");
        }
      }

      async function githubLoad() {
        const response = await fetch(`${contentsUrl()}?ref=${GITHUB.branch}&t=${Date.now()}`, {
          headers: githubHeaders(),
          cache: "no-store",
        });
        if (!response.ok) throw new Error("Could not read blogs.json from GitHub.");
        const data = await response.json();
        fileSha = data.sha;
        const parsed = JSON.parse(decodeBase64(data.content));
        if (Array.isArray(parsed)) posts = parsed;
      }

      async function githubSave(message) {
        const response = await fetch(contentsUrl(), {
          method: "PUT",
          headers: { ...githubHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            content: encodeBase64(JSON.stringify(posts, null, 2) + "\n"),
            sha: fileSha,
            branch: GITHUB.branch,
          }),
        });
        if (response.status === 401 || response.status === 403) {
          forgetKey("That key no longer works. Enter it again.");
          throw new Error("unauthorised");
        }
        if (response.status === 409) {
          await githubLoad();
          render();
          throw new Error("Someone else changed the posts first. The latest version is shown; try again.");
        }
        if (!response.ok) throw new Error(`GitHub refused the save (${response.status}).`);
        const data = await response.json();
        fileSha = data.content.sha;
      }

      // --- local serve.py -------------------------------------------------

      async function localSave() {
        let response;
        try {
          response = await fetch("./blogs.json", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Blog-Key": key },
            body: JSON.stringify(posts),
          });
        } catch {
          throw new Error("serve.py is not running.");
        }
        if (response.status === 403) {
          forgetKey("That key does not match.");
          throw new Error("unauthorised");
        }
        if (!response.ok) throw new Error(`The local server refused the save (${response.status}).`);
      }

      // --- shared ---------------------------------------------------------

      async function savePosts(message) {
        status("Saving…");
        try {
          if (local) await localSave();
          else await githubSave(message);
          status(local ? "Saved to blogs.json." : "Published. The live page updates in about a minute.");
        } catch (error) {
          if (error.message !== "unauthorised") status(error.message, true);
          throw error;
        }
      }

      async function removePost(post) {
        if (!confirm(`Delete “${post.title}”?`)) return;
        editing = false;
        const before = posts;
        posts = posts.filter((item) => item !== post);
        try {
          await savePosts(`Delete blog post: ${post.title}`);
        } catch {
          posts = before;
        }
        render();
      }

      function forgetKey(message) {
        key = "";
        sessionStorage.removeItem("blog-key");
        localStorage.removeItem("blog-key");
        fileSha = null;
        unlock.hidden = false;
        keyRow.hidden = false;
        editor.hidden = true;
        if (message) {
          keyError.textContent = message;
          keyError.hidden = false;
        }
        render();
      }

      async function openEditor() {
        if (!local) await githubLoad();
        unlock.hidden = true;
        editor.hidden = false;
        keyError.hidden = true;
        status("");
        render();
      }

      document.querySelector("#show-edit").addEventListener("click", () => {
        keyRow.hidden = false;
        keyInput.focus();
      });

      document.querySelector("#lock").addEventListener("click", () => forgetKey(""));

      unlock.addEventListener("submit", async (event) => {
        event.preventDefault();
        key = keyInput.value.trim();
        if (!key) return;
        keyError.hidden = true;
        unlockButton.disabled = true;
        try {
          if (local) {
            await localSave();
          } else {
            await githubVerify();
          }
          (remember.checked ? localStorage : sessionStorage).setItem("blog-key", key);
          keyInput.value = "";
          await openEditor();
        } catch (error) {
          key = "";
          if (error.message !== "unauthorised") {
            keyError.textContent = error.message;
            keyError.hidden = false;
          }
        } finally {
          unlockButton.disabled = false;
        }
      });

      editor.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = document.querySelector("#title");
        const body = document.querySelector("#body");
        const post = { title: title.value.trim(), body: body.value.trim(), updated: stamp() };
        if (!post.title || !post.body) return;
        publishButton.disabled = true;
        posts.unshift(post);
        try {
          await savePosts(`Add blog post: ${post.title}`);
          title.value = "";
          body.value = "";
        } catch {
          posts = posts.filter((item) => item !== post);
        } finally {
          publishButton.disabled = false;
          render();
        }
      });

      loadPublished().then(async () => {
        if (!key) return;
        try {
          await openEditor();
        } catch {
          forgetKey("The saved key no longer works. Enter it again.");
        }
      });
    </script>
  </body>
</html>
